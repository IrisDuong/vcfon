<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
        }
        .header {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .content {
            margin-top: 16px;
            color: #555;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        Welcome, <span th:text="${fullName}">User</span> 🎉
    </div>

    <div class="content">
        <p>
            Your internal account has been successfully created in our system.
        </p>

        <p>
            <strong>Username:</strong>
            <span th:text="${userName}">username</span>
        </p>

        <p th:if="${defaultPassword}">
            <strong>Temporary password:</strong>
            <span th:text="${defaultPassword}">password</span>
        </p>

        <p>
            Please click the button below to change your password for security
        </p>

        <a class="btn"
           th:href="${changePasswordUrl}">
            Login now
        </a>
    </div>

    <div class="footer">
        <p>
            If you did not request this account, please ignore this email.
        </p>
        <p>
            © <span>2026</span> Your Company
        </p>
    </div>
</div>
</body>
</html>
