syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.vcfon.grpc.usermgt";
option java_outer_classname = "SysUserProto";

message SysUserProtoRequest {
  string user_name = 1;
  string raw_password = 2;
  string hashed_password = 3;
  string email = 4;
  string first_name = 5;
  string last_name = 6;
  string phone_no = 7;
  int32 role_no = 8;
  string avatar_url = 9;
  string sub = 10;
  bool active = 11;
  bool deletable = 12;
  int32 locked_times = 13;
}

message SysUserProtoResponse {
  string user_name = 1;
  string email = 2;
  int32 role_no = 3;
  bool created = 4;
}

service SysUserProtoService {
  rpc createSysUserProto (SysUserProtoRequest) returns (SysUserProtoResponse);
}