syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "com.vcfon.grpc.notification";
option java_outer_classname = "MailProto";

message MailProtoRequest {
  string templateCode = 1;
  string recipient = 2;
  map<string, google.protobuf.Any> variables = 5;
}

service MailProtoService {
  rpc sendMail (MailProtoRequest) returns (google.protobuf.Empty);
}